<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{%- include head.html -%}
<body>

<a class="skip-link" href="#content">Skip to content</a>

<header class="topbar">
  <div class="shell topbar__inner">
    <a class="topbar__brand" href="{{ '/' | relative_url }}">bryamzxz</a>
    <nav class="topbar__nav" aria-label="Site">
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>about</a>
      <a href="https://github.com/bryamzxz" rel="me noopener">github</a>
      <a href="{{ '/feed.xml' | relative_url }}" rel="alternate">rss</a>
      <button type="button" class="topbar__theme" data-theme-toggle hidden>
        <span class="topbar__theme-label" data-theme-label>auto</span>
      </button>
    </nav>
  </div>
  {%- if page.layout == 'post' -%}
  <div class="readbar" data-readbar aria-hidden="true"><i data-readbar-fill></i></div>
  {%- endif -%}
</header>

<main class="shell" id="content" tabindex="-1">
  {{ content }}
</main>

{%- include footer.html -%}

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
