title: bryamzxz
email: bryamestebanvargas@gmail.com
author: Bryam Vargas
description: >-
  Independent security research, coordinated disclosure, and civic-tech
  forensics. Bug bounty against Colombian state infrastructure and mobile
  spyware forensics with civic partners.
url: "https://bryamzxz.github.io"
baseurl: ""
lang: en

# Build
theme: minima
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

# Jekyll defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# Rouge syntax highlighter
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Don't include these in the build
exclude:
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/
